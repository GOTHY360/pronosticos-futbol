# AI Football Predictor en la nube (GitHub Actions, gratis). Funciona con el PC apagado.
#  - 18:00 COL: análisis nocturno de mañana; el trabajo espera en la nube y entrega a las 21:00 exactas
#    (GitHub retrasa a veces los horarios hasta 1 h o más, por eso arranca con margen)
#  - 22:45 COL: NBA; espera a las 23:40 para analizar y entrega a medianoche
#  - Cada hora 08:00–22:00 COL: alineaciones y cambios de última hora
# La base de datos (≈165 MB) se guarda en la caché de Actions, no en el repositorio.
# Primera ejecución: si no hay caché, descarga el historial completo (~1,5 h) y valida los modelos.
name: pronosticos
on:
  schedule:
    - cron: "0 23 * * *"        # 18:00 COL → análisis nocturno + entrega a las 21:00
    - cron: "23 13-23 * * *"    # 08:23–18:23 COL → alineaciones
    - cron: "23 0-3 * * *"      # 19:23–22:23 COL → alineaciones
    - cron: "45 3 * * *"        # 22:45 COL → NBA: espera a las 23:40, analiza y entrega a medianoche
    - cron: "30 6 * * *"        # 01:30 COL → NBA: re-chequeo de partidos que terminaron tarde (+ correcciones)
  workflow_dispatch:
    inputs:
      mode: {description: "nightly | deliver | update | nba | nba_late", default: "nightly"}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pronosticos, cancel-in-progress: false}
env:
  PYTHONIOENCODING: utf-8
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: {name: github-pages}
    env:
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}   # opcional: lesiones, sanciones y árbitro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy
      - name: Modo
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          case "${{ github.event.schedule }}" in
            "0 23 * * *") M=nightly ;;
            "23 13-23 * * *"|"23 0-3 * * *") M=update ;;
            "45 3 * * *") M=nba ;;
            "30 6 * * *") M=nba_late ;;
          esac
          echo "mode=${M:-nightly}" >> "$GITHUB_OUTPUT"
      - name: Restaurar base de datos
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            pronosticos/data/pronosticos.sqlite
            pronosticos/data/model_params.json
            pronosticos/data/revision
            pronosticos/web/data
            nba/data/nba.sqlite
            nba/data/revision
            pronosticos/web/nba/data
          key: db-${{ github.run_id }}
          restore-keys: db-
      - name: Primera carga del historial (sólo si no hay base de datos)
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          python -m pronosticos.backfill
          python -m pronosticos.tuning
          python -m pronosticos.backtest
      - name: Primera carga NBA (sólo si no hay base de datos NBA)
        if: steps.mode.outputs.mode != 'deliver'
        run: |
          if [ ! -f nba/data/nba.sqlite ]; then python -m nba.backfill && python -m nba.backtest; fi
      - name: Análisis nocturno + entrega a las 21:00
        if: steps.mode.outputs.mode == 'nightly'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python -m pronosticos.run_daily
          python -m pronosticos.run_daily --review
          if [ "$(TZ=America/Bogota date +%u)" = "7" ]; then
            python -m pronosticos.tuning; python -m pronosticos.backtest; python -m pronosticos.run_daily --settle
            python -m nba.backtest || true
          fi
          python pronosticos/scripts/wait_until.py 20:50
          python -m pronosticos.run_daily --update || true
          python pronosticos/scripts/wait_until.py 21:00
          python -m pronosticos.app.notify
      - name: Alineaciones y última hora
        if: steps.mode.outputs.mode == 'update'
        run: |
          python -m pronosticos.run_daily --update
          python -m nba.run_daily --update || true
      - name: NBA a medianoche (análisis + entrega)
        if: steps.mode.outputs.mode == 'nba'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python pronosticos/scripts/wait_until.py 23:40
          python -m nba.run_daily
          python -m nba.run_daily --review
          python pronosticos/scripts/wait_until.py 00:00
          python -m nba.notify
      - name: NBA re-chequeo 1:30 am (correcciones por Telegram)
        if: steps.mode.outputs.mode == 'nba_late'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m nba.run_daily --update --notify-changes
      - name: Entrega manual por Telegram
        if: steps.mode.outputs.mode == 'deliver'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python -m pronosticos.run_daily --review
          python -m pronosticos.app.notify
      - name: Compactar base de datos
        if: steps.mode.outputs.mode != 'deliver'
        run: |
          python - <<'EOF'
          import os, sqlite3
          for f in ("pronosticos/data/pronosticos.sqlite", "nba/data/nba.sqlite"):
              if os.path.exists(f):
                  c = sqlite3.connect(f)
                  c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
                  c.execute("VACUUM")
                  c.close()
          EOF
      - name: Guardar base de datos
        if: always() && steps.mode.outputs.mode != 'deliver'
        uses: actions/cache/save@v4
        with:
          path: |
            pronosticos/data/pronosticos.sqlite
            pronosticos/data/model_params.json
            pronosticos/data/revision
            pronosticos/web/data
            nba/data/nba.sqlite
            nba/data/revision
            pronosticos/web/nba/data
          key: db-${{ github.run_id }}
      - name: Copia de seguridad semanal
        if: steps.mode.outputs.mode == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-db
          path: pronosticos/data/pronosticos.sqlite
          retention-days: 14
          overwrite: true
      # Tablero web: gratis con repositorio público. Con repositorio privado sin plan pago este paso
      # se omite y la entrega llega sólo por Telegram.
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with: {path: pronosticos/web}
      - uses: actions/deploy-pages@v4
        continue-on-error: true
