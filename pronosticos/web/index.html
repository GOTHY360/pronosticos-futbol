<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Football Predictor</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--text:#0f172a;--muted:#5b6474;--line:#e3e6eb;
  --accent:#0f766e;--accent-soft:#e6f4f2;--won:#15803d;--lost:#b91c1c;--pend:#a16207;--chip:#eef1f5;
  --warn-soft:#fdf4e3;--bad-soft:#fdecec;--bar:#0f766e;--bar-bg:#e8ebef;--exp:#94a3b8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220;--card:#121a2b;--text:#e7ecf3;--muted:#98a2b3;--line:#22304a;
    --accent:#2dd4bf;--accent-soft:#11302f;--won:#4ade80;--lost:#f87171;--pend:#fbbf24;--chip:#1b2538;
    --warn-soft:#2b2412;--bad-soft:#2d1618;--bar:#2dd4bf;--bar-bg:#22304a;--exp:#64748b;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220;--card:#121a2b;--text:#e7ecf3;--muted:#98a2b3;--line:#22304a;
  --accent:#2dd4bf;--accent-soft:#11302f;--won:#4ade80;--lost:#f87171;--pend:#fbbf24;--chip:#1b2538;
  --warn-soft:#2b2412;--bad-soft:#2d1618;--bar:#2dd4bf;--bar-bg:#22304a;--exp:#64748b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 6px}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
main{padding:16px 0 48px}
section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.pick-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.match{font-weight:700;font-size:16px}
.meta{color:var(--muted);font-size:13px}
.sel{font-size:17px;font-weight:700;margin:10px 0 6px;color:var(--accent)}
.prob{font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;line-height:1;text-align:right}
.prob small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.bar{position:relative;height:8px;background:var(--bar-bg);border-radius:4px;margin:10px 0 4px}
.bar .iv{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.25;border-radius:4px}
.bar .pt{position:absolute;top:-3px;width:3px;height:14px;background:var(--bar);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.won,.chip.ok{color:var(--won)}.chip.lost,.chip.bad{color:var(--lost)}.chip.pending,.chip.warn{color:var(--pend)}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
details ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.checks{list-style:none;padding:0 !important}
.checks li{display:flex;gap:8px}
.checks b{min-width:18px}
.empty{text-align:center;color:var(--muted);padding:32px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}
h2{font-size:15px;margin:22px 0 10px}
.row-list .item{padding:10px 0;border-bottom:1px solid var(--line)}
.row-list .item:last-child{border-bottom:0}
svg text{fill:var(--muted);font-size:11px}
.theme{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
@media (max-width:520px){ .prob{font-size:22px} .sel{font-size:16px} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div><h1>AI Football Predictor</h1><div class="sub" id="subtitle">Cargando…</div></div>
      <button class="theme" id="themeBtn" aria-label="Cambiar tema">◐</button>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="hoy" aria-selected="true">Pronósticos</button>
      <button role="tab" data-tab="partidos">Partidos analizados</button>
      <button role="tab" data-tab="rendimiento">Rendimiento real</button>
      <button role="tab" data-tab="modelo">Validación del modelo</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="hoy"></section>
  <section id="partidos" hidden></section>
  <section id="rendimiento" hidden></section>
  <section id="modelo" hidden></section>
</main>
<script>
const $ = s => document.querySelector(s);
const pct = (x, d=0) => x == null ? '—' : (x*100).toFixed(d) + '%';
const num = (x, d=3) => x == null ? '—' : Number(x).toFixed(d);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtKick = iso => new Date(iso).toLocaleString('es-CO', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'America/Bogota'});
const STATUS = {pending:'Pendiente', won:'Acertado', lost:'Fallado', void:'Nulo', withdrawn:'Retirado'};
const STCLS = {pending:'pending', won:'won', lost:'lost', void:'', withdrawn:'bad'};
const PHASE = {preliminar:'Preliminar (sin alineaciones)', actualizado:'Actualizado con alineaciones'};
const REVIEW = {pendiente:['Revisión del analista pendiente','warn'], aprobado:['Aprobado por el analista','ok'], revisar:['En revisión','warn'], rechazado:['Rechazado por el analista','bad']};
const CHK = {ok:['✓','ok'], fallo:['✗','bad'], pendiente:['…','warn'], aviso:['!','warn'], 'n/d':['–','']};

try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem('theme', nxt); } catch(e){}
};
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== b.dataset.tab);
  try { localStorage.setItem('tab', b.dataset.tab); } catch(e){}
});
try { const t = localStorage.getItem('tab'); if (t) document.querySelector(`nav button[data-tab="${t}"]`)?.click(); } catch(e){}

async function load(name){
  try { const r = await fetch('data/' + name + '?t=' + Date.now()); return r.ok ? r.json() : null; } catch(e){ return null; }
}

function probBar(p){
  const lo = p.prob_low ?? p.prob, hi = p.prob_high ?? p.prob;
  return `<div class="bar" title="Intervalo Monte Carlo ${pct(lo)}–${pct(hi)}"><span class="iv" style="left:${lo*100}%;width:${Math.max((hi-lo)*100,1)}%"></span><span class="pt" style="left:calc(${p.prob*100}% - 1px)"></span></div>
    <div class="meta" style="display:flex;justify-content:space-between"><span>Intervalo ${pct(lo)}–${pct(hi)}</span><span>Calidad de datos ${p.quality_score ?? '—'}/100</span></div>`;
}

function pickCard(p){
  const rv = REVIEW[p.review_status] || REVIEW.pendiente;
  const chips = [
    `<span class="chip">${esc(p.league_name)}</span>`,
    `<span class="chip">${esc(p.market_name)}</span>`,
    `<span class="chip">Riesgo ${esc(p.risk)}</span>`,
    p.odds_dec ? `<span class="chip ok">Cuota real ${p.odds_dec.toFixed(2)}</span>` : '',
    p.min_odds ? `<span class="chip ok">Apostar sólo a cuota ≥ ${p.min_odds.toFixed(2)}</span>` : `<span class="chip">Cuota justa ${(1/p.prob).toFixed(2)}</span>`,
    (!p.odds_dec && p.est_book_odds) ? `<span class="chip">Cuota típica ~${p.est_book_odds.toFixed(2)}</span>` : '',
    p.edge != null ? `<span class="chip ${p.edge>0?'ok':'bad'}">VE ${(p.edge*100).toFixed(1)}%</span>` : '',
    `<span class="chip ${p.phase==='actualizado'?'ok':'warn'}">${PHASE[p.phase]||esc(p.phase)}</span>`,
    p.status === 'pending' ? `<span class="chip ${rv[1]}">${rv[0]}</span>` : `<span class="chip ${STCLS[p.status]}">${STATUS[p.status]||p.status}</span>`,
  ].join('');
  const evo = (p.phase === 'actualizado' && p.prob_initial && Math.abs(p.prob_initial - p.prob) > 0.005)
    ? `<div class="meta">Probabilidad: ${pct(p.prob_initial)} preliminar → ${pct(p.prob)} con alineaciones</div>` : '';
  return `<article class="card">
    <div class="pick-head">
      <div><div class="match">${esc(p.match_name)}</div><div class="meta">${fmtKick(p.kickoff_utc)}</div></div>
      <div class="prob">${pct(p.prob)}<small>prob. estimada</small></div>
    </div>
    <div class="sel">${esc(p.label)}</div>
    ${probBar(p)}${evo}
    <div class="chips">${chips}</div>
    ${p.result_detail ? `<div class="meta" style="margin-top:8px">${esc(p.result_detail)}</div>` : ''}
    ${p.review_notes ? `<div class="meta" style="margin-top:4px">Analista: ${esc(p.review_notes)}</div>` : ''}
    <details><summary>Filtro de calidad</summary><ul class="checks">${(p.quality_checks||[]).map(c=>{const k=CHK[c.status]||['?',''];return `<li><b class="chip ${k[1]}">${k[0]}</b><span><b>${esc(c.name)}</b> · ${esc(c.detail)}</span></li>`}).join('')}</ul></details>
    <details><summary>Por qué este pronóstico</summary><ul>${(p.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details>
  </article>`;
}

const money = v => '$' + Math.round(v).toLocaleString('es-CO');
function megaCard(m, sim){
  if (!m) return `<h2>Súper combinada</h2><div class="card meta">No hay suficientes partidos (mínimo 4) con selecciones que superen el filtro de calidad para armarla hoy.</div>`;
  const ST = {pending:['…','warn'], won:['✓','ok'], lost:['✗','bad'], void:['–','']};
  const legs = m.legs.map(l => { const s = ST[l.status]||ST.pending;
    return `<li><b class="chip ${s[1]}">${s[0]}</b><span><b>${esc(l.label)}</b> · ${esc(l.match)} <span class="meta">(${pct(l.prob)}${l.result?' · '+esc(l.result):''})</span></span></li>`; }).join('');
  const st = m.status !== 'pending' ? `<span class="chip ${m.status==='won'?'ok':'bad'}">${m.status==='won'?'Acertada':m.status==='lost'?'Fallada':'Nula'} · ${esc(m.result_detail||'')}</span>` : `<span class="chip warn">Pendiente · ${esc(m.result_detail||'')}</span>`;
  const nMatches = new Set(m.legs.map(l => l.event_id)).size;
  const few = nMatches < m.n_legs, ss = sim && (few ? sim.few_matches : sim.many_matches);
  const simTxt = ss && ss.days ? `<div class="note warn" style="margin-top:10px">Historial simulado fuera de muestra, días ${few ? 'con pocos partidos (varias selecciones por partido)' : 'con muchos partidos (una selección por partido)'}: salió <b>${ss.won} de ${ss.days} días (${pct(ss.hit_rate,1)})</b>; anunciado ${pct(ss.mean_prob,1)}. Lo más frecuente es fallar 1 o 2 selecciones.</div>` : '';
  const sub = few ? `${m.n_legs} selecciones de ${nMatches} partidos: máximo 3 por partido, de tipos distintos (goles, tarjetas, tiros o atajadas) y sin combinar tiros con atajadas del mismo partido` : 'Las de mayor probabilidad de partidos distintos que superan el filtro de calidad';
  return `<h2>Súper combinada · alto riesgo</h2><article class="card" id="mega" data-fair="${m.fair_odds}" data-est="${m.est_odds}">
    <div class="pick-head"><div><div class="match">${m.n_legs} selecciones en una sola apuesta</div><div class="meta">${sub}</div></div>
    <div class="prob">${pct(m.prob,1)}<small>prob. de acertarla</small></div></div>
    <div class="bar"><span class="iv" style="left:${m.prob_low*100}%;width:${Math.max((m.prob_high-m.prob_low)*100,1)}%"></span><span class="pt" style="left:calc(${m.prob*100}% - 1px)"></span></div>
    <div class="meta">Intervalo ${pct(m.prob_low,1)}–${pct(m.prob_high,1)} · aproximadamente 1 de cada ${Math.round(1/m.prob)} días</div>
    <div class="chips"><span class="chip">Cuota justa ${m.fair_odds.toFixed(2)}</span><span class="chip">Cuota típica estimada ${m.est_odds.toFixed(2)}</span><span class="chip ${m.expected_value>=0?'ok':'bad'}">Valor esperado ${(m.expected_value*100).toFixed(0)}%</span>${st}</div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="meta" for="stake">Apuesta</label>
      <input id="stake" type="number" min="0" step="1000" value="10000" style="width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit">
      <span class="meta" id="payout"></span></div>
    <details open><summary>Selecciones</summary><ul class="checks">${legs}</ul></details>
    ${simTxt}
    <div class="note bad" style="margin-top:10px">Cada selección añadida multiplica el pago, pero también el riesgo y el margen de la casa. Con cuotas típicas el valor esperado es negativo: a largo plazo se pierde dinero aunque a veces se gane mucho. Úsala sólo con dinero que puedas perder.</div>
  </article>`;
}
function wireMega(){
  const el = document.getElementById('mega'), inp = document.getElementById('stake'), out = document.getElementById('payout');
  if (!el || !inp) return;
  const upd = () => { const s = Number(inp.value)||0; out.innerHTML = `Si acierta: <b>${money(s*Number(el.dataset.est))}</b> con cuota típica (${money(s*Number(el.dataset.fair))} a cuota justa)`; };
  try { const v = localStorage.getItem('stake'); if (v) inp.value = v; } catch(e){}
  inp.oninput = () => { upd(); try { localStorage.setItem('stake', inp.value); } catch(e){} };
  upd();
}

function renderToday(latest, model){
  const el = $('#hoy');
  if (!latest){ el.innerHTML = `<div class="empty">Todavía no hay análisis. Ejecuta <code>python -m pronosticos.run_daily</code>.</div>`; return; }
  const d = new Date(latest.target_date + 'T12:00:00');
  $('#subtitle').textContent = 'Partidos del ' + d.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'}) +
     ' · actualizado ' + new Date(latest.updated_at || latest.generated_at).toLocaleString('es-CO', {hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'});
  const n = latest.picks.length, blocked = latest.analyzed.filter(a=>a.status==='descartado').length;
  let html = `<div class="note">Se analizaron <b>${latest.analyzed.length}</b> partidos: <b>${blocked}</b> descartados por riesgo o falta de datos, <b>${latest.n_candidates}</b> selecciones superaron el filtro de calidad y ${n===1 ? 'se publica la <b>1</b> mejor respaldada' : `se publican las <b>${n}</b> mejor respaldadas`}. Una probabilidad alta no garantiza el acierto: revisa el rendimiento real.</div>`;
  const r = latest.rules || {};
  if (r.odds_min) html += `<div class="note">Pronósticos individuales con cuota entre <b>${r.odds_min.toFixed(2)} y ${r.odds_max.toFixed(2)}</b> (preferencia ${r.target_odds.toFixed(2)}). Cada uno indica la <b>cuota mínima</b> a la que vale la pena apostar: si tu casa paga menos, no apuestes.</div>`;
  if ((latest.disabled_markets||[]).length) html += `<div class="note warn">Mercados desactivados por rendir peor de lo anunciado fuera de muestra: ${latest.disabled_markets.map(esc).join(', ')}.</div>`;
  if (!n) html += `<div class="card empty">No hay oportunidades con respaldo suficiente. No pronosticar también es una buena decisión.</div>`;
  html += latest.picks.map(pickCard).join('');
  if (latest.combo){
    const legs = latest.picks.filter(p => latest.combo.legs.includes(p.pick_id));
    html += `<div class="card"><div class="match">Combinada opcional · ${pct(latest.combo.prob)}</div>
      <div class="meta">${legs.map(l=>esc(l.label)+' ('+esc(l.match_name)+')').join(' + ')}</div>
      <div class="meta" style="margin-top:6px">${esc(latest.combo.note)}</div></div>`;
  }
  html += megaCard(latest.mega, model && model.combo_simulation);
  if ((latest.in_review||[]).length) html += `<h2>Pendientes de revisión</h2>` + latest.in_review.map(pickCard).join('');
  if ((latest.withdrawn||[]).length) html += `<h2>Retirados antes del partido</h2>` + latest.withdrawn.map(pickCard).join('');
  if ((latest.alerts||[]).length) html += `<h2>Cambios de última hora</h2><div class="card row-list">` + latest.alerts.map(a=>`<div class="item"><b>${esc(a.kind)}</b> · ${esc(a.message)} <span class="meta">→ ${esc(a.action)} · ${new Date(a.created_at).toLocaleString('es-CO',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</span></div>`).join('') + `</div>`;
  el.innerHTML = html;

  const rows = latest.analyzed.map(a => {
    const pr = a.probs || {}, sc = a.scenarios;
    return `<div class="item"><div class="match" style="font-size:14px">${esc(a.home)} vs ${esc(a.away)}${a.neutral?' <span class="chip">sede neutral</span>':''}</div>
      <div class="meta">${esc(a.league_name)} · ${fmtKick(a.kickoff_utc)} · <b>${esc(a.status)}</b>${a.xg ? ` · goles esperados ${a.xg[0]}–${a.xg[1]}` : ''}</div>
      ${pr['1X2:H'] != null ? `<div class="meta">1X2 ${pct(pr['1X2:H'])} / ${pct(pr['1X2:D'])} / ${pct(pr['1X2:A'])} · Más de 2.5 ${pct(pr['OU_GOALS:over'])} · Ambos marcan ${pct(pr['BTTS:yes'])}</div>` : ''}
      ${sc ? `<div class="meta">Monte Carlo (10.000 partidos): ${sc.top_scores.slice(0,4).map(t=>esc(t.score)+' '+pct(t.p)).join(' · ')}</div>` : ''}
      ${(a.notes||[]).map(n=>`<div class="meta">⚠ ${esc(n)}</div>`).join('')}</div>`;
  }).join('');
  $('#partidos').innerHTML = `<div class="card row-list">${rows || '<div class="empty">Sin partidos.</div>'}</div>`;
}

function lineChart(series, keys, colors, fmt, w=640, h=220){
  if (series.length < 2) return '<div class="meta">Se necesitan al menos 2 pronósticos liquidados.</div>';
  const pad=36, vals = series.flatMap(s=>keys.map(k=>s[k]));
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi-lo < 1e-9){hi+=1;lo-=1;}
  const sx = i => pad + i*(w-pad-8)/(series.length-1), sy = v => h-24 - (v-lo)/(hi-lo)*(h-34);
  let g = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
  [lo,(lo+hi)/2,hi].forEach(v => g += `<text x="2" y="${sy(v)+4}">${fmt(v)}</text><line x1="${pad}" x2="${w-8}" y1="${sy(v)}" y2="${sy(v)}" stroke="currentColor" opacity=".08"/>`);
  keys.forEach((k,j) => g += `<polyline fill="none" stroke="${colors[j]}" stroke-width="2" points="${series.map((s,i)=>sx(i)+','+sy(s[k])).join(' ')}"/>`);
  g += `<text x="${pad}" y="${h-6}">${esc(series[0].date)}</text><text x="${w-8}" y="${h-6}" text-anchor="end">${esc(series.at(-1).date)}</text>`;
  return g + '</svg>';
}
function relChart(points, w=320, h=220){
  const pad = 30, sx = x => pad + x*(w-pad-10), sy = y => h-pad - y*(h-pad-10);
  let g = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w*1.6}px" role="img" aria-label="Curva de calibración">`;
  g += `<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" stroke="currentColor" opacity=".25" stroke-dasharray="4 4"/>`;
  [0,.25,.5,.75,1].forEach(t => { g += `<text x="${sx(t)}" y="${h-10}" text-anchor="middle">${t*100}%</text><text x="4" y="${sy(t)+4}">${t*100}%</text>`; });
  const pts = points.filter(p=>p.n>=10);
  if (pts.length > 1) g += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.map(p=>sx(p.mean_p)+','+sy(p.freq)).join(' ')}"/>`;
  pts.forEach(p => g += `<circle cx="${sx(p.mean_p)}" cy="${sy(p.freq)}" r="${Math.min(3+Math.sqrt(p.n)/4,9)}" fill="var(--accent)" opacity=".8"><title>Anunciado ${pct(p.mean_p,1)} → real ${pct(p.freq,1)} (n=${p.n})</title></circle>`);
  return g + `</svg>`;
}
function summaryTable(title, obj){
  const rows = Object.entries(obj||{});
  if (!rows.length) return '';
  return `<h2>${title}</h2><div class="card tbl"><table><thead><tr><th></th><th class="r">n</th><th class="r">Acierto</th><th class="r">Esperado</th><th class="r">Brier</th><th class="r">Beneficio (u)</th><th class="r">Pend.</th></tr></thead><tbody>` +
    rows.map(([k,s])=>`<tr><td>${esc(k)}</td><td class="r">${s.n}</td><td class="r">${pct(s.hit_rate,1)}</td><td class="r">${pct(s.expected_hit_rate,1)}</td><td class="r">${num(s.brier)}</td><td class="r">${s.profit_units==null?'—':s.profit_units.toFixed(2)}</td><td class="r">${s.pending}</td></tr>`).join('') + `</tbody></table></div>`;
}

function renderPerformance(h){
  const el = $('#rendimiento');
  if (!h){ el.innerHTML = '<div class="empty">Sin historial todavía.</div>'; return; }
  const o = h.overall;
  let html = `<div class="kpis">
    <div class="card kpi"><div class="v">${o.n}</div><div class="l">Pronósticos liquidados</div></div>
    <div class="card kpi"><div class="v">${pct(o.hit_rate,1)}</div><div class="l">Efectividad real</div></div>
    <div class="card kpi"><div class="v">${pct(o.expected_hit_rate,1)}</div><div class="l">Efectividad anunciada</div></div>
    <div class="card kpi"><div class="v">${num(o.brier)}</div><div class="l">Brier score (0 = perfecto)</div></div>
    <div class="card kpi"><div class="v">${o.roi_flat==null?'—':(o.roi_flat*100).toFixed(1)+'%'}</div><div class="l">Rentabilidad simulada (stake fijo, cuota real, n=${o.n_with_odds})</div></div>
    <div class="card kpi"><div class="v">${o.pending}</div><div class="l">Pendientes · ${o.withdrawn} retirados · ${o.void} nulos</div></div>
  </div>`;
  if (o.n < 100) html += `<div class="note warn">Con menos de 100 pronósticos liquidados las cifras dependen mucho del azar. Se registran todos, incluidos los fallados y los retirados.</div>`;
  html += `<h2>Evolución: efectividad real vs. anunciada</h2><div class="card">${lineChart(h.series,['hit','expected'],['var(--accent)','var(--exp)'],v=>pct(v))}
    <div class="legend"><span><i style="background:var(--accent)"></i>Real acumulada</span><span><i style="background:var(--exp)"></i>Anunciada (prob. media)</span></div></div>`;
  if (h.series.some(s=>s.profit)) html += `<h2>Rentabilidad histórica simulada (unidades, stake 1)</h2><div class="card">${lineChart(h.series,['profit'],['var(--accent)'],v=>v.toFixed(1))}<div class="meta">Sólo pronósticos con cuota real disponible al publicarse.</div></div>`;
  html += summaryTable('Por liga', h.by_league) + summaryTable('Por mercado', h.by_market) + summaryTable('Por modelo', h.by_model) +
          summaryTable('Por fase (preliminar vs. con alineaciones)', h.by_phase) + summaryTable('Por calidad de datos', h.by_quality) + summaryTable('Por nivel de riesgo', h.by_risk);
  if ((h.models_live||[]).length) html += `<h2>Rendimiento de cada modelo (todas sus predicciones, publicadas o no)</h2><div class="card tbl"><table><thead><tr><th>Modelo</th><th class="r">Predicciones</th><th class="r">Brier</th><th class="r">Log-loss</th><th class="r">Prob. media</th><th class="r">Frecuencia real</th></tr></thead><tbody>` +
     h.models_live.map(m=>`<tr><td>${esc(m.name)}</td><td class="r">${m.n}</td><td class="r">${num(m.brier)}</td><td class="r">${num(m.logloss)}</td><td class="r">${pct(m.mean_prob,1)}</td><td class="r">${pct(m.freq,1)}</td></tr>`).join('') + `</tbody></table></div>`;
  if (h.calibration.length) html += `<h2>Calibración de los pronósticos publicados</h2><div class="card">${relChart(h.calibration)}<div class="meta">Si los puntos siguen la diagonal, “80%” significa acertar ~80% de las veces.</div></div>`;
  if ((h.prob_evolution||[]).length) html += `<h2>Evolución de probabilidades (preliminar → alineaciones)</h2><div class="card tbl"><table><thead><tr><th>Pronóstico</th><th class="r">Preliminar</th><th class="r">Final</th><th>Estado</th></tr></thead><tbody>` +
     h.prob_evolution.map(e=>`<tr><td>${esc(e.match)}<div class="meta">${esc(e.label)}</div></td><td class="r">${pct(e.initial)}</td><td class="r">${pct(e.final)}</td><td>${STATUS[e.status]||e.status}</td></tr>`).join('') + `</tbody></table></div>`;
  const cb = h.combos;
  if (cb && cb.list.length) html += `<h2>Súper combinadas</h2><div class="card"><div class="kpis" style="margin:0">
      <div class="kpi"><div class="v">${cb.won} / ${cb.n}</div><div class="l">Acertadas / liquidadas</div></div>
      <div class="kpi"><div class="v">${pct(cb.hit_rate,1)}</div><div class="l">Real</div></div>
      <div class="kpi"><div class="v">${pct(cb.expected,1)}</div><div class="l">Anunciado</div></div>
      <div class="kpi"><div class="v">${cb.profit_est==null?'—':cb.profit_est.toFixed(1)+' u'}</div><div class="l">Beneficio simulado (cuota típica)</div></div></div>
      <div class="tbl"><table><thead><tr><th>Fecha</th><th class="r">Selecciones</th><th class="r">Prob.</th><th class="r">Cuota típica</th><th>Resultado</th></tr></thead><tbody>${cb.list.map(c=>`<tr><td>${esc(c.target_date)}</td><td class="r">${c.n_legs}</td><td class="r">${pct(c.prob,1)}</td><td class="r">${c.est_odds.toFixed(2)}</td><td>${STATUS[c.status]||c.status} · ${esc(c.result_detail||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
  html += `<h2>Pronósticos acertados y fallados</h2>` + (h.picks.length ? h.picks.map(pickCard).join('') : '<div class="empty">Aún no hay pronósticos.</div>');
  el.innerHTML = html;
}

function renderModel(m){
  const el = $('#modelo');
  if (!m){ el.innerHTML = '<div class="empty">Ejecuta el backtest para ver la validación.</div>'; return; }
  let html = `<div class="note">Backtest walk-forward: cada partido se predijo sólo con datos anteriores a su semana (${m.n_matches} partidos fuera de muestra). Brier: error cuadrático de la probabilidad (0 = perfecto). “Mejora” compara con predecir siempre la frecuencia media.</div>`;
  if (m.simulation){ const s = m.simulation;
    html += `<h2>Simulación del selector (fuera de muestra)</h2><div class="card"><div class="kpis" style="margin:0">
      <div class="kpi"><div class="v">${s.n}</div><div class="l">Pronósticos que habría publicado (${s.days} días)</div></div>
      <div class="kpi"><div class="v">${pct(s.hit,1)}</div><div class="l">Acierto real</div></div>
      <div class="kpi"><div class="v">${pct(s.mean_prob,1)}</div><div class="l">Acierto anunciado</div></div>
      <div class="kpi"><div class="v">${num(s.brier)}</div><div class="l">Brier</div></div></div>
      <div class="tbl" style="margin-top:8px"><table><thead><tr><th>Mercado</th><th class="r">n</th><th class="r">Real</th><th class="r">Anunciado</th></tr></thead><tbody>${Object.entries(s.by_market||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.n}</td><td class="r">${pct(v.hit,1)}</td><td class="r">${pct(v.mean_prob,1)}</td></tr>`).join('')}</tbody></table></div>
      <div class="meta">Calibración aprendida con datos anteriores al ${esc(s.split)} y probada después. Sin cuotas históricas fiables, no aplica el filtro de valor.</div></div>`; }
  if (m.holdout && m.holdout.n) html += `<div class="meta" style="margin:-4px 0 12px">Brier sin calibrar ${num(m.holdout.brier_raw,4)} → calibrado ${num(m.holdout.brier_cal,4)} (n=${m.holdout.n}).</div>`;
  const pr = Object.entries(m.params||{}).filter(([k])=>!k.startsWith('_'));
  if (pr.length) html += `<h2>Modelos especializados por mercado</h2><div class="card tbl"><table><thead><tr><th>Modelo</th><th class="r">Vida media (días)</th><th class="r">Previa</th><th class="r">Log-verosimilitud</th><th class="r">Por defecto</th></tr></thead><tbody>${pr.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.half_life}</td><td class="r">${v.prior}</td><td class="r">${num(v.nll,4)}</td><td class="r">${num(v.nll_default,4)}</td></tr>`).join('')}</tbody></table></div>`;
  html += `<h2>Por mercado</h2><div class="card tbl"><table><thead><tr><th>Mercado</th><th class="r">Selecciones</th><th class="r">Brier</th><th class="r">Mejora</th><th class="r">Log-loss</th></tr></thead><tbody>` +
    m.by_market.map(r=>`<tr><td>${esc(r.name)}</td><td class="r">${r.n}</td><td class="r">${num(r.brier)}</td><td class="r">${pct(r.skill,1)}</td><td class="r">${num(r.logloss)}</td></tr>`).join('') + `</tbody></table></div>`;
  html += `<h2>Calibración (probabilidades ≥ 60%)</h2><div class="card">${relChart(m.reliability_high)}</div>`;
  html += `<h2>Por competición</h2><div class="card tbl"><table><thead><tr><th>Competición</th><th class="r">Selecciones</th><th class="r">Brier</th><th class="r">Mejora</th></tr></thead><tbody>` +
    m.by_league.map(r=>`<tr><td>${esc(r.name)}</td><td class="r">${r.n}</td><td class="r">${num(r.brier)}</td><td class="r">${pct(r.skill,1)}</td></tr>`).join('') + `</tbody></table></div>`;
  el.innerHTML = html;
}

(async () => {
  const [latest, hist, model] = await Promise.all([load('latest.json'), load('history.json'), load('model.json')]);
  renderToday(latest, model); wireMega(); renderPerformance(hist); renderModel(model);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
